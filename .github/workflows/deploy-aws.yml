name: Deploy AWS

on:
  workflow_dispatch:
    inputs:
      env_name:
        description: "Environment name (stack ids are Varada-<env_name>-<Stack>)"
        required: true
        default: "dev"
        type: string
      stacks:
        description: "Which stacks to deploy (network, database, indexer, Swarm node, publisher, observability)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - network
          - data
          - indexer
          - swarm
          - publisher
          - observability

concurrency:
  group: deploy-aws
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: cdk deploy
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE_NAME: ${{ vars.AWS_DEPLOY_ROLE_NAME }}
    steps:
      - name: Check configuration
        run: |
          for v in AWS_ACCOUNT_ID AWS_REGION AWS_DEPLOY_ROLE_NAME; do
            if [ -z "${!v}" ]; then
              echo "Repository variable $v is not set"
              exit 1
            fi
          done
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Assume deploy role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_DEPLOY_ROLE_NAME }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: varada-deploy-${{ github.run_id }}
      - name: Deploy
        working-directory: infra
        env:
          CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ vars.AWS_REGION }}
          ENV_NAME: ${{ inputs.env_name }}
          STACKS: ${{ inputs.stacks }}
          # Non-secret deployment settings, set as repository or environment variables.
          INDEXER_DOMAIN_NAME: ${{ vars.INDEXER_DOMAIN_NAME }}
          INDEXER_CERTIFICATE_ARN: ${{ vars.INDEXER_CERTIFICATE_ARN }}
          INDEXER_HOSTED_ZONE_ID: ${{ vars.INDEXER_HOSTED_ZONE_ID }}
          INDEXER_HOSTED_ZONE_NAME: ${{ vars.INDEXER_HOSTED_ZONE_NAME }}
          INDEXER_CORS_ORIGINS: ${{ vars.INDEXER_CORS_ORIGINS }}
          INDEXER_IMAGE_TAG: ${{ vars.INDEXER_IMAGE_TAG }}
          START_BLOCK: ${{ vars.START_BLOCK }}
          FACTORY_ADDRESS: ${{ vars.FACTORY_ADDRESS }}
          FEE_VAULT_ADDRESS: ${{ vars.FEE_VAULT_ADDRESS }}
          CAUSE_REGISTRY_ADDRESS: ${{ vars.CAUSE_REGISTRY_ADDRESS }}
          EPOCH_GOVERNOR_ADDRESS: ${{ vars.EPOCH_GOVERNOR_ADDRESS }}
          DONATION_DISTRIBUTOR_ADDRESS: ${{ vars.DONATION_DISTRIBUTOR_ADDRESS }}
          FEE_CONSOLIDATOR_ADDRESS: ${{ vars.FEE_CONSOLIDATOR_ADDRESS }}
          QUOTE_REGISTRY_ADDRESS: ${{ vars.QUOTE_REGISTRY_ADDRESS }}
          TOKEN_REGISTRY_ADDRESS: ${{ vars.TOKEN_REGISTRY_ADDRESS }}
          CAUSE_CATALOG_ADDRESS: ${{ vars.CAUSE_CATALOG_ADDRESS }}
          CURATOR_REGISTRY_ADDRESS: ${{ vars.CURATOR_REGISTRY_ADDRESS }}
          TAKEOVER_GOVERNOR_ADDRESS: ${{ vars.TAKEOVER_GOVERNOR_ADDRESS }}
          VOTING_SCHEME_ADDRESS: ${{ vars.VOTING_SCHEME_ADDRESS }}
          ROTATION_GOVERNOR_ADDRESS: ${{ vars.ROTATION_GOVERNOR_ADDRESS }}
          SWARM_DOMAIN_NAME: ${{ vars.SWARM_DOMAIN_NAME }}
          SWARM_CERTIFICATE_ARN: ${{ vars.SWARM_CERTIFICATE_ARN }}
          SWARM_HOSTED_ZONE_ID: ${{ vars.SWARM_HOSTED_ZONE_ID }}
          SWARM_HOSTED_ZONE_NAME: ${{ vars.SWARM_HOSTED_ZONE_NAME }}
          SWARM_DESIRED_COUNT: ${{ vars.SWARM_DESIRED_COUNT }}
          PUBLISHER_DOMAIN_NAME: ${{ vars.PUBLISHER_DOMAIN_NAME }}
          PUBLISHER_CERTIFICATE_ARN: ${{ vars.PUBLISHER_CERTIFICATE_ARN }}
          PUBLISHER_HOSTED_ZONE_ID: ${{ vars.PUBLISHER_HOSTED_ZONE_ID }}
          PUBLISHER_HOSTED_ZONE_NAME: ${{ vars.PUBLISHER_HOSTED_ZONE_NAME }}
          PUBLISHER_IMAGE_TAG: ${{ vars.PUBLISHER_IMAGE_TAG }}
          PUBLISHER_DESIRED_COUNT: ${{ vars.PUBLISHER_DESIRED_COUNT }}
          PUBLISHER_CORS_ORIGINS: ${{ vars.PUBLISHER_CORS_ORIGINS }}
          SWARM_GATEWAY_URL: ${{ vars.SWARM_GATEWAY_URL }}
          INDEXER_PUBLIC_URL: ${{ vars.INDEXER_PUBLIC_URL }}
          ARKIV_CHAIN: ${{ vars.ARKIV_CHAIN }}
          ARKIV_ENABLED: ${{ vars.ARKIV_ENABLED }}
          # Curator agents and x402 paid routes (all optional, off by default). The secrets (CDP keys,
          # facilitator token, 1Claw agent) live in Secrets Manager, never in workflow variables.
          ENS_PARENT_NAME: ${{ vars.ENS_PARENT_NAME }}
          MAX_REPORT_BYTES: ${{ vars.MAX_REPORT_BYTES }}
          X402_ENABLED: ${{ vars.X402_ENABLED }}
          X402_BASE_PAY_TO: ${{ vars.X402_BASE_PAY_TO }}
          X402_BASE_NETWORK: ${{ vars.X402_BASE_NETWORK }}
          X402_BASE_FACILITATOR_URL: ${{ vars.X402_BASE_FACILITATOR_URL }}
          X402_MAINNET_PAY_TO: ${{ vars.X402_MAINNET_PAY_TO }}
          X402_MAINNET_NETWORK: ${{ vars.X402_MAINNET_NETWORK }}
          X402_MAINNET_FACILITATOR_URL: ${{ vars.X402_MAINNET_FACILITATOR_URL }}
          X402_PRICE_RANKINGS: ${{ vars.X402_PRICE_RANKINGS }}
          X402_PRICE_HISTORY: ${{ vars.X402_PRICE_HISTORY }}
          X402_PRICE_CATALOG: ${{ vars.X402_PRICE_CATALOG }}
          X402_PRICE_NEWSLETTERS: ${{ vars.X402_PRICE_NEWSLETTERS }}
          X402_MAINNET_MIN_PRICE: ${{ vars.X402_MAINNET_MIN_PRICE }}
          X402_FACILITATOR_ENABLED: ${{ vars.X402_FACILITATOR_ENABLED }}
          X402_FACILITATOR_PAY_TO: ${{ vars.X402_FACILITATOR_PAY_TO }}
          X402_FACILITATOR_NETWORK: ${{ vars.X402_FACILITATOR_NETWORK }}
          X402_FACILITATOR_USDC: ${{ vars.X402_FACILITATOR_USDC }}
          ONECLAW_BASE_URL: ${{ vars.ONECLAW_BASE_URL }}
        run: |
          ctx=(-c "envName=$ENV_NAME")
          add() { if [ -n "$2" ]; then ctx+=(-c "$1=$2"); fi; }
          add indexerDomainName "$INDEXER_DOMAIN_NAME"
          add indexerCertificateArn "$INDEXER_CERTIFICATE_ARN"
          add indexerHostedZoneId "$INDEXER_HOSTED_ZONE_ID"
          add indexerHostedZoneName "$INDEXER_HOSTED_ZONE_NAME"
          add indexerCorsOrigins "$INDEXER_CORS_ORIGINS"
          add indexerImageTag "$INDEXER_IMAGE_TAG"
          add startBlock "$START_BLOCK"
          add factoryAddress "$FACTORY_ADDRESS"
          add feeVaultAddress "$FEE_VAULT_ADDRESS"
          add causeRegistryAddress "$CAUSE_REGISTRY_ADDRESS"
          add epochGovernorAddress "$EPOCH_GOVERNOR_ADDRESS"
          add donationDistributorAddress "$DONATION_DISTRIBUTOR_ADDRESS"
          add feeConsolidatorAddress "$FEE_CONSOLIDATOR_ADDRESS"
          add quoteRegistryAddress "$QUOTE_REGISTRY_ADDRESS"
          add tokenRegistryAddress "$TOKEN_REGISTRY_ADDRESS"
          add causeCatalogAddress "$CAUSE_CATALOG_ADDRESS"
          add curatorRegistryAddress "$CURATOR_REGISTRY_ADDRESS"
          add takeoverGovernorAddress "$TAKEOVER_GOVERNOR_ADDRESS"
          add votingSchemeAddress "$VOTING_SCHEME_ADDRESS"
          add rotationGovernorAddress "$ROTATION_GOVERNOR_ADDRESS"
          add swarmDomainName "$SWARM_DOMAIN_NAME"
          add swarmCertificateArn "$SWARM_CERTIFICATE_ARN"
          add swarmHostedZoneId "$SWARM_HOSTED_ZONE_ID"
          add swarmHostedZoneName "$SWARM_HOSTED_ZONE_NAME"
          add swarmDesiredCount "$SWARM_DESIRED_COUNT"
          add publisherDomainName "$PUBLISHER_DOMAIN_NAME"
          add publisherCertificateArn "$PUBLISHER_CERTIFICATE_ARN"
          add publisherHostedZoneId "$PUBLISHER_HOSTED_ZONE_ID"
          add publisherHostedZoneName "$PUBLISHER_HOSTED_ZONE_NAME"
          add publisherImageTag "$PUBLISHER_IMAGE_TAG"
          add publisherDesiredCount "$PUBLISHER_DESIRED_COUNT"
          add publisherCorsOrigins "$PUBLISHER_CORS_ORIGINS"
          add swarmGatewayUrl "$SWARM_GATEWAY_URL"
          add indexerPublicUrl "$INDEXER_PUBLIC_URL"
          add arkivChain "$ARKIV_CHAIN"
          add arkivEnabled "$ARKIV_ENABLED"
          add ensParentName "$ENS_PARENT_NAME"
          add maxReportBytes "$MAX_REPORT_BYTES"
          add x402Enabled "$X402_ENABLED"
          add x402BasePayTo "$X402_BASE_PAY_TO"
          add x402BaseNetwork "$X402_BASE_NETWORK"
          add x402BaseFacilitatorUrl "$X402_BASE_FACILITATOR_URL"
          add x402MainnetPayTo "$X402_MAINNET_PAY_TO"
          add x402MainnetNetwork "$X402_MAINNET_NETWORK"
          add x402MainnetFacilitatorUrl "$X402_MAINNET_FACILITATOR_URL"
          add x402PriceRankings "$X402_PRICE_RANKINGS"
          add x402PriceHistory "$X402_PRICE_HISTORY"
          add x402PriceCatalog "$X402_PRICE_CATALOG"
          add x402PriceNewsletters "$X402_PRICE_NEWSLETTERS"
          add x402MainnetMinPrice "$X402_MAINNET_MIN_PRICE"
          add x402FacilitatorEnabled "$X402_FACILITATOR_ENABLED"
          add x402FacilitatorPayTo "$X402_FACILITATOR_PAY_TO"
          add x402FacilitatorNetwork "$X402_FACILITATOR_NETWORK"
          add x402FacilitatorUsdc "$X402_FACILITATOR_USDC"
          add oneClawBaseUrl "$ONECLAW_BASE_URL"
          prefix="Varada-${ENV_NAME}"
          case "$STACKS" in
            all) targets=("$prefix-Network" "$prefix-Data" "$prefix-Indexer" "$prefix-Swarm" "$prefix-Publisher" "$prefix-Observability") ;;
            network) targets=("$prefix-Network") ;;
            data) targets=("$prefix-Data") ;;
            indexer) targets=("$prefix-Indexer") ;;
            swarm) targets=("$prefix-Swarm") ;;
            publisher) targets=("$prefix-Publisher") ;;
            observability) targets=("$prefix-Observability") ;;
            *) echo "unknown stack selection"; exit 1 ;;
          esac
          pnpm exec cdk deploy "${targets[@]}" "${ctx[@]}" --require-approval never
