[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
evm_version = "cancun"
via_ir = true
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read", path = "./test/fixtures" },
]
optimizer = true
optimizer_runs = 200
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@uniswap/v4-core/=lib/v4-core/",
  "@uniswap/v4-periphery/=lib/v4-periphery/",
  "v4-core/=lib/v4-core/src/",
  "v4-periphery/=lib/v4-periphery/src/",
  "solmate/=lib/v4-core/lib/solmate/",
  "permit2/=lib/v4-periphery/lib/permit2/",
  "@fhevm/solidity/=node_modules/@fhevm/solidity/",
  "encrypted-types/=node_modules/encrypted-types/",
]

[profile.ci]
fuzz = { runs = 1_000 }

# Fast profile for the generic hooks in src/hooks (builds in seconds; no via_ir).
# Separate out/cache so it never invalidates the default via_ir build.
[profile.hooks]
src = "src/hooks"
test = "test/hooks"
script = "script/hooks"
out = "out-hooks"
cache_path = "cache-hooks"
via_ir = false

[rpc_endpoints]
mainnet = "${ETH_RPC_URL}"

[fmt]
line_length = 100
number_underscore = "thousands"
sort_imports = true
tab_width = 4
